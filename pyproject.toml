[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sra-framework"
version = "0.1.0"
description = "Agentic AI framework that drafts an FDA cybersecurity Security Risk Assessment (SRA) for a connected embedded medical device by reading its legacy docs, firmware, threat model, and regulatory corpus."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Balaji Bankapur", email = "bankapur.balaji@gmail.com" }]
license = { text = "MIT" }

dependencies = [
    # CLI + config
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",

    # Vector DB + embeddings
    "chromadb>=0.5",
    "openai>=1.30",

    # Graph DB
    "kuzu>=0.4",

    # Doc parsing
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",

    # Code parsing (Step 2: firmware chunking)
    "tree-sitter>=0.21",
    "tree-sitter-languages>=1.10",

    # Agent orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "litellm>=1.40",

    # MCP servers
    "mcp>=1.0",

    # Review UI
    "streamlit>=1.35",

    # Utilities
    "tenacity>=8.2",
    "httpx>=0.27",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
sra = "framework.cli:app"

[tool.setuptools.packages.find]
include = ["framework*"]

[tool.ruff]
line-length = 100
target-version = "py310"
